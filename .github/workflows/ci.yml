name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Require real MCP SDK (no skipped wire test)
        run: python -c 'import mcp'
      - run: python -m pytest -q --cov=ai_council --cov-fail-under=80
      - run: python -m build
      - name: Offline simulated smoke test
        run: ai-council demo --database /tmp/council-ci.sqlite3
