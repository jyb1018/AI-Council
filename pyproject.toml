[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council-mcp"
version = "1.0.0"
description = "Local, subscription-backed AI deliberation through official CLIs and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI-Council contributors"}]
dependencies = ["mcp>=1.20,<2", "pydantic>=2.10,<3", "starlette>=0.48,<2", "uvicorn>=0.35,<1", "httpx>=0.28,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
ai-council = "ai_council.cli:main"

[project.urls]
Repository = "https://github.com/jyb1018/AI-Council"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
ai_council = ["static/*"]
